<div id="donateModal" class="donate-modal">
  <div class="donate-modal-content">
    <span class="donate-close" onclick="closeDonateModal()">&times;</span>

    <h2 style="font-family: 'Vazirmatn', sans-serif;">حمایت مالی از پروژه</h2>

    </a>

    <div class="crypto-box">
      <h3 style="font-family: 'Vazirmatn', sans-serif;">کیف پول کریپتو</h3>
      <p style="font-family: 'Vazirmatn', sans-serif;"><b>USDT BEP20:</b></p>
      <div style="display: flex; align-items: center; gap: 8px;">
        <code id="walletAddress" style="flex: 1; word-break: break-all;">0xDbE82d5D542a8646EA124916F110f4c3583A7a2D</code>
        <button onclick="copyWalletAddress(event)" class="copy-wallet-btn" title="کپی آدرس کیف پول" style="font-family: 'Vazirmatn', sans-serif;">
          📋
        </button>
      </div>
    </div>

<script>
function openDonateModal() {
  document.getElementById("donateModal").style.display = "flex";
}

function closeDonateModal() {
  document.getElementById("donateModal").style.display = "none";
}

function copyWalletAddress(event) {
  const walletAddress = document.getElementById("walletAddress").textContent;
  navigator.clipboard.writeText(walletAddress).then(() => {
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = "✓";
    setTimeout(() => {
      btn.textContent = originalText;
    }, 2000);
  }).catch(err => {
    alert("Failed to copy: " + err);
  });
}
</script>
